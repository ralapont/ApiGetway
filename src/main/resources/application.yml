server:
  port: 8090

spring:
  application:
    name: api-gateway

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  tracing:
    sampling:
      probability: 1.0   # 100% de las peticiones trazadas
  zipkin:
    endpoint: http://localhost:9411/api/v2/spans